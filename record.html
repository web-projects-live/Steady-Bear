<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D6E6A">
<title>小熊</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#EEF2EF;--surface:#fff;--ink:#1C2B2F;--muted:#5E6F72;--line:#D3DDD9;--tide:#2D6E6A;--tide-ink:#fff;--tide-soft:#D5E6E2;--sun:#E8A93B;--sun-soft:#F7E6C4;--danger:#B4483C;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#10191B;--surface:#172427;--ink:#E6EEEC;--muted:#93A5A6;--line:#263738;--tide:#6FB7AE;--tide-ink:#0C1A1B;--tide-soft:#1F3735;--sun:#F0B954;--sun-soft:#3A3020;--danger:#E07A6C}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;padding:env(safe-area-inset-top,0) 0 0}
main{max-width:560px;margin:0 auto;padding:20px 18px 110px}
h1,h2{margin:0;line-height:1.3}
h1{font-size:1.6rem}
h2{font-size:1.12rem;margin-bottom:8px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:.88rem}
.bear{width:60px;height:60px;flex:none}
.head{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.card{background:var(--surface);border-radius:20px;padding:16px 18px;margin-bottom:14px}
.top{display:flex;gap:12px;align-items:flex-start}
.em{font-size:1.7rem;line-height:1.2}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.ok{color:var(--tide);font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:0;border-radius:999px;padding:11px 18px;min-height:46px;background:var(--tide);color:var(--tide-ink);font-weight:700;cursor:pointer}
.btn.soft{background:var(--tide-soft);color:var(--ink)}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.rec{background:var(--danger);color:#fff}
.btn.sun{background:var(--sun);color:#1C2B2F}
.btn:disabled{opacity:.45}
.btn.wide{width:100%}
.chip{border:1.5px solid var(--line);background:none;border-radius:999px;padding:7px 13px;min-height:38px;font-size:.92rem;cursor:pointer}
.chip.on{background:var(--tide);border-color:var(--tide);color:var(--tide-ink)}
input[type=email],input[type=text],input[type=password],textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:48px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:.9rem;color:var(--muted);margin:14px 0 6px}
details{margin-top:10px}
details p{margin:6px 0;font-size:.95rem;line-height:1.6}
audio{width:100%;margin-top:10px}
.recbox{background:var(--sun-soft);border-radius:14px;padding:12px 14px;margin-top:12px}
.timer{font-size:1.4rem;font-weight:700}
.msg{min-height:1.2em}
.list{list-style:none;margin:0;padding:0}
.list li{padding:9px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.who{font-size:.82rem;color:var(--muted)}
.bubble{white-space:pre-wrap;overflow-wrap:anywhere}
.tr{background:var(--tide-soft);border-radius:12px;padding:8px 12px;margin-top:6px;white-space:pre-wrap}
.react{font-size:1.1rem}
.status{display:inline-block;font-size:.8rem;border-radius:999px;padding:2px 10px;background:var(--tide-soft)}
.status.wait{background:var(--sun-soft)}
.steps{margin:8px 0 0;padding-left:0;list-style:none}
.steps li{padding:3px 0}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0));z-index:20}
nav button{flex:1;background:none;border:0;padding:8px 2px;border-radius:14px;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;cursor:pointer}
nav button span{font-size:1.3rem;line-height:1.2}
nav button.on{color:var(--ink);font-weight:700;background:var(--tide-soft)}
.badge{position:absolute;top:2px;right:24%;background:var(--sun);color:#1C2B2F;border-radius:999px;font-size:.7rem;padding:0 6px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:50;max-width:90vw}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" hidden></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="journey.js"></script>
<script>
'use strict';
const CFG = {
  url: 'https://zskqjwwcyczezouglzmi.supabase.co',
  key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpza3Fqd3djeWN6ZXpvdWdsem1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDMzMDEsImV4cCI6MjA5Njc3OTMwMX0.ofebeGhucWa6G7MpoUIyJhthK2CnK8PPkAPINg7HW7s',
  maxBytes: 15 * 1024 * 1024
};
const sb = supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'jo.partner.auth' } });
const CH = window.JOURNEY || [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BEAR = `<svg class="bear" viewBox="0 0 100 100" aria-hidden="true"><circle cx="28" cy="30" r="12" fill="#B07A4F"/><circle cx="72" cy="30" r="12" fill="#B07A4F"/><circle cx="28" cy="30" r="6.5" fill="#7A5032"/><circle cx="72" cy="30" r="6.5" fill="#7A5032"/><circle cx="50" cy="54" r="33" fill="#B07A4F"/><ellipse cx="50" cy="66" rx="15" ry="11" fill="#EBD3B0"/><circle cx="38" cy="48" r="3.6" fill="#281E1A"/><circle cx="62" cy="48" r="3.6" fill="#281E1A"/><ellipse cx="50" cy="61" rx="5.5" ry="3.8" fill="#281E1A"/><path d="M44 67 q3 4 6 0 q3 4 6 0" stroke="#281E1A" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`;
function toast(t, ms = 2600) { const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role','status'); d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms); }

let me = null, owner = null, tab = 'home', R = null;
let D = { ov: null, plan: null, doses: [], feed: [], journal: [], dreams: [], sugg: [], audio: [] };
let TZ = 'America/New_York';
const tr = {};            // translation cache for shared entries
let AI = { kind: 'routine', items: [], busy: false };

const hisTime = d => new Intl.DateTimeFormat('zh-CN', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(d));
const hisDay = d => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(d));
const shortDate = d => new Intl.DateTimeFormat('zh-CN', { month: 'numeric', day: 'numeric' }).format(new Date(d));
const when = d => new Intl.DateTimeFormat('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(d));

async function ai(body) {
  const { data, error } = await sb.functions.invoke('jo-partner-ai', { body });
  if (error || !data || data.error) throw new Error(data?.error || error?.message || 'ai');
  return data;
}

/* ---------- Sign-in ---------- */
function signIn(step = 'email') {
  $('#nav').hidden = true;
  const email = localStorage.getItem('jo.partner.email') || '';
  $('#app').innerHTML = `<div class="head">${BEAR}<div><h1>小熊</h1><p class="muted" style="margin:0">陪他一起，看看他今天怎么样。</p></div></div>
  <div class="card">${step === 'email' ? `
    <label for="em">你的邮箱</label><input id="em" type="email" value="${esc(email)}" autocomplete="email">
    <label for="pw">密码</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn wide" style="margin-top:14px" data-act="pwlogin">登录</button>
    <button class="btn ghost wide" style="margin-top:10px" data-act="send">忘记密码？用邮件登录</button>` : `
    <p>请查看 <b>${esc(email)}</b> 的邮件：点邮件里的链接，或者输入邮件里的验证码。</p>
    <label for="code">验证码</label><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10">
    <button class="btn wide" style="margin-top:14px" data-act="verify">登录</button>
    <button class="btn ghost wide" style="margin-top:10px" data-act="back">返回</button>`}
    <p class="small muted msg" id="msg"></p></div>`;
}
async function enter(user) {
  me = user;
  const { data, error } = await sb.from('jo_members').select('role,partner_of').eq('user_id', user.id).maybeSingle();
  if (error) { $('#app').innerHTML = `<div class="card">网络连接有问题，请稍后再试。<div class="btns"><button class="btn" onclick="location.reload()">重试</button></div></div>`; return; }
  if (!data || data.role !== 'partner' || !data.partner_of) {
    $('#app').innerHTML = `<div class="card"><p>这个账号还没有权限。</p><button class="btn" data-act="out">退出登录</button></div>`; return;
  }
  owner = data.partner_of;
  $('#app').innerHTML = `<div class="card muted">加载中…</div>`;
  await loadAll(); render();
}

/* ---------- Data ---------- */
async function loadAll() {
  const since7 = new Date(Date.now() - 8 * 864e5).toISOString();
  const since60 = new Date(Date.now() - 60 * 864e5).toISOString();
  const [ov, plan, doses, feed, journal, dreams, sugg, audio] = await Promise.all([
    sb.rpc('jo_partner_overview'),
    sb.from('jo_med_plan').select('*').eq('owner', owner).eq('active', true).order('created_at', { ascending: false }).limit(1),
    sb.from('jo_med_doses').select('taken_at').eq('owner', owner).gte('taken_at', since7).order('taken_at'),
    sb.from('jo_shared_feed').select('*').eq('owner', owner).gte('created_at', since60).order('created_at', { ascending: false }),
    sb.from('jo_journal').select('*').eq('owner', owner).eq('shared', true).order('created_at', { ascending: false }).limit(20),
    sb.from('jo_dreams').select('*').eq('owner', owner).eq('shared', true).order('created_at', { ascending: false }).limit(20),
    sb.from('jo_suggestions').select('*').eq('owner', owner).order('created_at', { ascending: false }).limit(40),
    sb.from('jo_journey_audio').select('*').eq('owner', owner)
  ]);
  D = { ov: ov.data, plan: plan.data?.[0] || null, doses: doses.data || [], feed: feed.data || [], journal: journal.data || [],
        dreams: dreams.data || [], sugg: sugg.data || [], audio: audio.data || [] };
  if (D.ov?.tz) TZ = D.ov.tz;
}
const fromHim = f => f.author !== me.id;
const unseen = () => D.feed.filter(f => fromHim(f) && !f.seen_at).length;

/* ---------- Shell ---------- */
function render() {
  $('#nav').hidden = false;
  const n = unseen();
  const tabs = [['home', '🏠', '今天'], ['feed', '💬', '动态'], ['ideas', '✨', '建议'], ['rec', '🎙️', '录音']];
  $('#nav').innerHTML = tabs.map(([k, i, l]) => `<button class="${tab === k ? 'on' : ''}" data-act="tab" data-t="${k}"><span aria-hidden="true">${i}</span>${l}${k === 'feed' && n ? `<b class="badge">${n}</b>` : ''}</button>`).join('');
  $('#app').innerHTML = ({ home: vHome, feed: vFeed, ideas: vIdeas, rec: vRec })[tab]();
  if (tab === 'feed' && n) markSeen();
}
const header = (t, sub) => `<div class="head">${BEAR}<div><h1>${t}</h1>${sub ? `<p class="muted" style="margin:0">${sub}</p>` : ''}</div></div>`;

/* ---------- 今天 ---------- */
function vHome() {
  const ov = D.ov || { top3: [], checkins: [] };
  const today = ov.today || hisDay(Date.now());
  const ck = ov.checkins || [];
  const last = ck[ck.length - 1];
  return header('他今天怎么样', `他那边现在是 ${hisTime(Date.now())}（美国东部时间）`) + `
  <section class="card"><h2>今天的三件事</h2>
    ${ov.top3.length ? `<ul class="list">${ov.top3.map(t => `<li>${t.done ? '<span class="ok">✓</span> ' : '○ '}${esc(t.title)}</li>`).join('')}</ul>
      <p class="small muted" style="margin:8px 0 0">任务是英文的。完成了 ${ov.top3.filter(t => t.done).length} / ${ov.top3.length}。</p>`
      : `<p class="muted" style="margin:0">他今天还没有选三件事。</p>`}</section>
  ${medCard(today)}
  <section class="card"><h2>心情和焦虑（最近两周）</h2>
    ${ck.length ? chart(ck) + `<div class="legend"><span><i style="background:var(--tide)"></i>心情（越高越好）</span><span><i style="background:var(--sun)"></i>焦虑（越高越紧张）</span></div>
      ${last ? `<p class="small muted" style="margin:8px 0 0">最近一次（${shortDate(last.day + 'T12:00:00')}）：心情 ${last.mood ?? '–'}，焦虑 ${last.anxiety ?? '–'}，专注 ${last.focus ?? '–'}${last.sleep_hours != null ? `，睡了 ${last.sleep_hours} 小时` : ''}（1–5 分）</p>` : ''}`
      : `<p class="muted" style="margin:0">他还没有打卡记录。</p>`}</section>
  <section class="card"><h2>给他一点鼓励</h2>
    <button class="btn sun wide" data-act="hug">🤗 发一个抱抱</button>
    <label for="note">给他留言（可以写中文，会自动翻译成英文）</label>
    <textarea id="note" placeholder="想对他说的话…"></textarea>
    <button class="btn wide" style="margin-top:10px" data-act="send-note">发送</button>
    <p class="small muted msg" id="notemsg"></p></section>`;
}
function medCard(today) {
  const p = D.plan;
  if (!p) return `<section class="card"><h2>用药</h2><p class="muted" style="margin:0">他还没有设置用药记录。</p></section>`;
  const byDay = {};
  D.doses.forEach(d => { const k = hisDay(d.taken_at); (byDay[k] = byDay[k] || []).push(d); });
  const td = byDay[today] || [];
  const days = Object.keys(byDay).sort().reverse().filter(k => k !== today).slice(0, 6);
  return `<section class="card"><h2>用药：${esc(p.medicine)} ${esc(p.strength)}</h2>
    <p style="margin:0;font-weight:700">${td.length ? `今天已经吃了 ${td.length} 次（${td.map(d => hisTime(d.taken_at)).join('、')}）` : '今天还没有记录吃药'}</p>
    <p class="small muted" style="margin:2px 0 0">每天最多 ${p.max_per_day} 次${p.second_cutoff ? `，第二次不晚于 ${p.second_cutoff.slice(0, 5)}` : ''}（他那边的时间）。这里只能查看。</p>
    ${days.length ? `<details><summary class="small muted">前几天</summary><ul class="list">${days.map(k => `<li class="small">${shortDate(k + 'T12:00:00')}：${byDay[k].length} 次（${byDay[k].map(d => hisTime(d.taken_at)).join('、')}）</li>`).join('')}</ul></details>` : ''}</section>`;
}
function chart(ck) {
  const W = 320, H = 130, P = 18, n = 14;
  const start = new Date((D.ov.today) + 'T12:00:00').getTime() - 13 * 864e5;
  const x = day => P + ((new Date(day + 'T12:00:00').getTime() - start) / 864e5) * ((W - 2 * P) / (n - 1));
  const y = v => H - P - (v - 1) * ((H - 2 * P) / 4);
  const line = (k, color) => { const pts = ck.filter(c => c[k] != null).map(c => `${x(c.day).toFixed(1)},${y(c[k]).toFixed(1)}`);
    return pts.length ? `<polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>` + pts.map(p => `<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3.5" fill="${color}"/>`).join('') : ''; };
  const grid = [1, 3, 5].map(v => `<line x1="${P}" x2="${W - P}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="2" y="${y(v) + 4}" font-size="10" fill="var(--muted)">${v}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="最近两周的心情和焦虑">${grid}${line('anxiety', 'var(--sun)')}${line('mood', 'var(--tide)')}</svg>`;
}

/* ---------- 动态 ---------- */
const KIND = { win: '🎉', hug: '🤗', message: '💬', reply: '↩️' };
function vFeed() {
  const entries = [...D.journal.map(j => ({ ...j, _t: 'journal' })), ...D.dreams.map(d => ({ ...d, _t: 'dream' }))]
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  return header('动态', '他分享的事情和你们之间的消息') + `
  ${entries.length ? `<section class="card"><h2>他分享的日记和梦</h2>${entries.map(entryRow).join('')}</section>` : ''}
  <section class="card"><h2>消息</h2>
    ${D.feed.length ? D.feed.map(feedRow).join('') : `<p class="muted" style="margin:0">还没有消息。去「今天」给他发一个抱抱吧。</p>`}</section>`;
}
function feedRow(f) {
  const his = fromHim(f);
  let text = f.kind === 'hug' ? (his ? '给你发了一个抱抱' : '你发了一个抱抱') : '';
  if (!text) text = his ? f.body : f.body;
  const showTr = his && f.kind !== 'hug';
  return `<div class="item" id="f-${f.id}"><div class="who">${KIND[f.kind] || ''} ${his ? '他' : '你'} · ${when(f.created_at)}${!his && f.seen_at ? ' · 他看过了' : ''}</div>
    <div class="bubble">${esc(text)}</div>
    ${showTr ? (f.body_zh ? `<div class="tr">${esc(f.body_zh)}</div>` : `<button class="chip" style="margin-top:6px" data-act="tr-feed" data-id="${f.id}">🌐 翻译</button>`) : ''}
    ${his ? `<div class="btns" style="margin-top:8px">${['❤️', '🤗', '🎉', '👍'].map(e => `<button class="chip react ${f.partner_reaction === e ? 'on' : ''}" data-act="react" data-id="${f.id}" data-e="${e}" aria-label="回应 ${e}">${e}</button>`).join('')}
      <button class="chip" data-act="reply-open" data-ref="feed" data-id="${f.id}">回复</button></div><div id="reply-feed-${f.id}"></div>` : ''}</div>`;
}
function entryText(e) {
  if (e._t === 'journal') return (e.turns || []).filter(t => t.role !== 'ai').map(t => t.text).join('\n\n') + (e.reflection ? `\n\n${e.reflection}` : '');
  return [e.title, e.text].filter(Boolean).join('\n\n');
}
function readingText(e) {
  const r = e.reading; if (!r) return '';
  if (typeof r === 'string') return r;
  return Object.entries(r).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.join('; ') : typeof v === 'object' ? JSON.stringify(v) : v}`).join('\n');
}
function entryRow(e) {
  const k = `${e._t}-${e.id}`, label = e._t === 'journal' ? '📓 日记' : (e.nightmare ? '🌑 噩梦' : '🌙 梦');
  const reading = e._t === 'dream' ? readingText(e) : '';
  return `<div class="item"><div class="who">${label} · ${when(e.created_at)}</div>
    <details><summary><b>${esc(e.title || (e._t === 'journal' ? (e.template || '日记') : '梦'))}</b></summary>
      <div class="bubble" style="margin-top:6px">${esc(entryText(e))}</div>
      ${reading ? `<div class="who" style="margin-top:10px">解读</div><div class="bubble">${esc(reading)}</div>` : ''}
      ${tr[k] ? `<div class="tr">${esc(tr[k])}</div>` : `<button class="chip" style="margin-top:8px" data-act="tr-entry" data-k="${k}">🌐 翻译</button>`}
      <div class="btns"><button class="chip" data-act="reply-open" data-ref="${e._t}" data-id="${e.id}">回复</button></div><div id="reply-${e._t}-${e.id}"></div>
    </details></div>`;
}

/* ---------- 建议 ---------- */
const KINDS = [['routine', '日常安排'], ['task', '任务'], ['note', '小纸条']];
const ST = { pending: ['等待他回复', 'wait'], accepted: ['他接受了 ✓', ''], declined: ['他这次没有采用', ''] };
function vIdeas() {
  return header('给他建议', '日常安排、任务或小纸条，他可以选择接受') + `
  <section class="card">
    <div class="btns" style="margin-top:0" role="group" aria-label="类型">${KINDS.map(([k, l]) => `<button class="chip ${AI.kind === k ? 'on' : ''}" data-act="kind" data-k="${k}">${l}</button>`).join('')}</div>
    <label for="idea">你的想法（可以写中文，也可以空着让 AI 帮你想）</label>
    <textarea id="idea" placeholder="${AI.kind === 'routine' ? '比如：睡前放松的小习惯' : AI.kind === 'task' ? '比如：给妈妈打个电话' : '比如：提醒他好好吃午饭'}"></textarea>
    <div class="btns"><button class="btn sun" data-act="ai-suggest" ${AI.busy ? 'disabled' : ''}>✨ 让 AI 帮我想</button>
      <button class="btn soft" data-act="send-direct">直接发送</button></div>
    <p class="small muted msg" id="ideamsg">${AI.busy ? 'AI 正在想…' : ''}</p>
    ${AI.items.map((it, i) => aiCard(it, i)).join('')}
  </section>
  <section class="card"><h2>你发过的建议</h2>
    ${D.sugg.length ? D.sugg.map(s => `<div class="item"><div class="who">${(KINDS.find(k => k[0] === s.kind) || [])[1] || ''} · ${when(s.created_at)}</div>
      <b>${esc(s.title_zh || s.title || '')}</b>${s.body_zh ? `<div class="bubble small">${esc(s.body_zh)}</div>` : ''}
      ${s.steps?.length ? `<ul class="steps small">${s.steps.map(st => `<li>${esc(st.emoji || '•')} ${esc(st.title_zh || st.title_en)} · ${st.minutes} 分钟</li>`).join('')}</ul>` : ''}
      <span class="status ${(ST[s.status] || ST.pending)[1]}">${(ST[s.status] || ST.pending)[0]}</span>
      ${s.status === 'pending' ? ` <button class="chip" data-act="sugg-del" data-id="${s.id}">撤回</button>` : ''}</div>`).join('')
      : `<p class="muted" style="margin:0">还没有发过建议。</p>`}</section>`;
}
function aiCard(it, i) {
  return `<div class="card" style="background:var(--sun-soft);margin-top:12px">
    <b>${esc(it.title_zh)}</b>${it.body_zh ? `<div class="bubble small" style="margin-top:4px">${esc(it.body_zh)}</div>` : ''}
    ${it.steps.length ? `<ul class="steps small">${it.steps.map(s => `<li>${esc(s.emoji)} ${esc(s.title_zh)} · ${s.minutes} 分钟</li>`).join('')}</ul>` : ''}
    <details><summary class="small muted">他会看到的英文</summary><p><b>${esc(it.title_en)}</b><br>${esc(it.body_en)}</p>
      ${it.steps.length ? `<ul class="steps small">${it.steps.map(s => `<li>${esc(s.emoji)} ${esc(s.title_en)} · ${s.minutes} min</li>`).join('')}</ul>` : ''}</details>
    <div class="btns"><button class="btn" data-act="ai-send" data-i="${i}">发送给他</button><button class="btn ghost" data-act="ai-drop" data-i="${i}">不要这个</button></div></div>`;
}

/* ---------- 录音 ---------- */
const audioFor = k => D.audio.find(a => a.chapter === k);
function vRec() {
  const n = CH.filter(c => audioFor(c.key)).length;
  return header('录音', `已录 ${n} / ${CH.length} 章。读英文原文或者用你自己的话都可以。`) + CH.map((c, i) => recCard(c, i)).join('') +
    `<p class="small muted">录好的声音只有他能听到。重新录音会替换旧的。</p><button class="btn ghost" data-act="out">退出登录</button>`;
}
function recCard(c, i) {
  const a = audioFor(c.key), active = R && R.key === c.key;
  return `<section class="card" id="card-${c.key}"><div class="top"><span class="em" aria-hidden="true">${c.emoji}</span>
    <div class="grow"><div class="small muted">第 ${i + 1} 章</div><h2 style="margin:0">${esc(c.zh_title)}</h2>
      <p class="muted small" style="margin:4px 0 0">${esc(c.zh_summary)}</p>${a ? `<div class="ok small">✓ 已录音</div>` : ''}</div></div>
    <details><summary class="small muted">查看英文原文（${esc(c.title)}）</summary>${c.why.concat(c.how).map(p => `<p>${esc(p)}</p>`).join('')}</details>
    ${active ? recBox() : `<div class="btns">
      <button class="btn rec" data-act="rec" data-k="${c.key}">🎙️ ${a ? '重新录音' : '录音'}</button>
      <label class="btn soft" style="margin:0;display:inline-flex;align-items:center">上传文件<input type="file" accept="audio/*" data-k="${c.key}" hidden></label>
      ${a ? `<button class="btn ghost" data-act="play" data-k="${c.key}">▶ 试听</button><button class="btn ghost" data-act="del" data-k="${c.key}">删除</button>` : ''}
    </div><div id="play-${c.key}"></div>`}
    <p class="small muted msg" id="msg-${c.key}"></p></section>`;
}
function recBox() {
  if (R.blob) return `<div class="recbox"><b>录好了，先听一下：</b><audio controls src="${R.url}"></audio>
    <div class="btns"><button class="btn" data-act="save">保存</button><button class="btn ghost" data-act="redo">重录</button><button class="btn ghost" data-act="cancel">取消</button></div></div>`;
  return `<div class="recbox"><span class="timer" id="timer">0:00</span> <span class="muted">正在录音…</span>
    <div class="btns"><button class="btn rec" data-act="stop">⏹ 停止</button><button class="btn ghost" data-act="cancel">取消</button></div></div>`;
}
function redrawCard(key) { const i = CH.findIndex(c => c.key === key); const el = $('#card-' + key); if (el) el.outerHTML = recCard(CH[i], i); }
function msg(key, t) { const el = $('#msg-' + key); if (el) el.textContent = t; }
const pickMime = () => ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
const extFor = m => m.includes('mp4') || m.includes('m4a') || m.includes('aac') ? 'm4a' : m.includes('ogg') ? 'ogg' : m.includes('mpeg') || m.includes('mp3') ? 'mp3' : m.includes('wav') ? 'wav' : 'webm';
async function startRec(key) {
  if (R) cancelRec();
  if (!window.MediaRecorder) { msg(key, '这个浏览器不能直接录音。可以用手机自带的录音软件录好，再点「上传文件」。'); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { msg(key, '没有麦克风权限。请在浏览器设置里允许使用麦克风。'); return; }
  const mime = pickMime();
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  const st = { key, rec, stream, chunks: [], start: Date.now(), mime: rec.mimeType || mime || 'audio/webm' };
  R = st;
  rec.ondataavailable = e => { if (e.data.size) st.chunks.push(e.data); };
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop()); clearInterval(st.tick);
    if (st.cancelled || R !== st) return;
    st.blob = new Blob(st.chunks, { type: st.mime }); st.url = URL.createObjectURL(st.blob);
    st.secs = Math.round((Date.now() - st.start) / 1000); redrawCard(key);
  };
  rec.start(1000); redrawCard(key);
  st.tick = setInterval(() => { const s = Math.round((Date.now() - st.start) / 1000); const t = $('#timer'); if (t) t.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }, 500);
}
function cancelRec() {
  if (!R) return; const key = R.key; R.cancelled = true; clearInterval(R.tick);
  try { if (R.rec.state !== 'inactive') R.rec.stop(); } catch {}
  R.stream.getTracks().forEach(t => t.stop()); R = null; redrawCard(key);
}
async function upload(key, blob, mime, secs) {
  if (blob.size > CFG.maxBytes) { msg(key, '文件太大了（最多 15MB）。请录短一点。'); return false; }
  msg(key, '正在上传…');
  const path = `${owner}/journey/${key}/${Date.now()}.${extFor(mime)}`;
  const up = await sb.storage.from('jo-media').upload(path, blob, { contentType: mime, upsert: false });
  if (up.error) { msg(key, '上传失败：' + up.error.message); return false; }
  const old = audioFor(key);
  const res = await sb.from('jo_journey_audio').upsert({ owner, chapter: key, path, mime, duration_sec: secs || null, recorded_by: me.id }, { onConflict: 'owner,chapter' });
  if (res.error) { msg(key, '保存失败：' + res.error.message); await sb.storage.from('jo-media').remove([path]); return false; }
  if (old && old.path !== path) await sb.storage.from('jo-media').remove([old.path]);
  const a = await sb.from('jo_journey_audio').select('*').eq('owner', owner); D.audio = a.data || D.audio;
  return true;
}

/* ---------- Actions ---------- */
async function markSeen() {
  const ids = D.feed.filter(f => fromHim(f) && !f.seen_at).map(f => f.id);
  if (!ids.length) return;
  const now = new Date().toISOString();
  const { error } = await sb.from('jo_shared_feed').update({ seen_at: now }).in('id', ids);
  if (!error) { D.feed.forEach(f => { if (ids.includes(f.id)) f.seen_at = now; }); const b = $('nav .badge'); if (b) b.remove(); }
}
async function sendMessage(text, kind = 'message', ref) {
  let en = null;
  if (kind !== 'hug') { try { en = (await ai({ mode: 'translate', text, to: 'en' })).text; } catch {} }
  const row = { owner, author: me.id, kind, body: text, body_en: en, ...(ref || {}) };
  const { data, error } = await sb.from('jo_shared_feed').insert(row).select().single();
  if (error) { toast('发送失败：' + error.message); return false; }
  D.feed.unshift(data); return true;
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id, k = b.dataset.k;
  switch (a) {
    case 'pwlogin': {
      const em = $('#em').value.trim().toLowerCase(), pw = $('#pw').value; if (!em || !pw) return;
      localStorage.setItem('jo.partner.email', em); b.disabled = true; $('#msg').textContent = '正在登录…';
      const { error } = await sb.auth.signInWithPassword({ email: em, password: pw });
      if (error) { b.disabled = false; $('#msg').textContent = /invalid/i.test(error.message) ? '邮箱或密码不对，请再试一次。' : '登录失败：' + error.message; }
      break; }
    case 'send': {
      const em = $('#em').value.trim().toLowerCase(); if (!em) { $('#msg').textContent = '请先填写邮箱。'; return; }
      localStorage.setItem('jo.partner.email', em); b.disabled = true;
      const { error } = await sb.auth.signInWithOtp({ email: em, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } });
      if (error) { b.disabled = false; $('#msg').textContent = '发送失败：' + error.message; return; }
      signIn('code'); break; }
    case 'verify': {
      const { error } = await sb.auth.verifyOtp({ email: localStorage.getItem('jo.partner.email'), token: $('#code').value.trim(), type: 'email' });
      if (error) $('#msg').textContent = '验证码不对，请再检查一下，或者点邮件里的链接。'; break; }
    case 'back': signIn('email'); break;
    case 'out': await sb.auth.signOut(); me = null; signIn(); break;
    case 'tab': tab = b.dataset.t; if (R) cancelRec(); render(); window.scrollTo(0, 0); break;

    case 'hug': b.disabled = true; if (await sendMessage('🤗', 'hug')) toast('抱抱发出去了 🤗'); b.disabled = false; break;
    case 'send-note': {
      const t = $('#note').value.trim(); if (!t) return;
      b.disabled = true; $('#notemsg').textContent = '正在发送…';
      if (await sendMessage(t)) { $('#note').value = ''; $('#notemsg').textContent = '发送好了 ✓'; } else $('#notemsg').textContent = '';
      b.disabled = false; break; }
    case 'react': {
      const f = D.feed.find(x => x.id === id), v = f.partner_reaction === b.dataset.e ? null : b.dataset.e;
      const { error } = await sb.from('jo_shared_feed').update({ partner_reaction: v }).eq('id', id);
      if (error) return toast('没有成功：' + error.message);
      f.partner_reaction = v; render(); break; }
    case 'reply-open': {
      const box = $(`#reply-${b.dataset.ref}-${id}`);
      box.innerHTML = `<textarea id="rt-${id}" placeholder="写点什么…" style="margin-top:8px"></textarea>
        <div class="btns"><button class="btn" data-act="reply-send" data-ref="${b.dataset.ref}" data-id="${id}">发送回复</button></div>`;
      $(`#rt-${id}`).focus(); break; }
    case 'reply-send': {
      const t = $(`#rt-${id}`).value.trim(); if (!t) return; b.disabled = true;
      if (await sendMessage(t, 'reply', { ref_kind: b.dataset.ref, ref_id: id })) { toast('回复发出去了'); render(); } else b.disabled = false;
      break; }
    case 'tr-feed': {
      const f = D.feed.find(x => x.id === id); b.disabled = true; b.textContent = '翻译中…';
      try { const t = (await ai({ mode: 'translate', text: f.body, to: 'zh' })).text; f.body_zh = t;
        await sb.from('jo_shared_feed').update({ body_zh: t }).eq('id', id); render(); }
      catch { b.disabled = false; b.textContent = '🌐 翻译失败，再试一次'; }
      break; }
    case 'tr-entry': {
      const [t, eid] = [k.split('-')[0], k.slice(k.indexOf('-') + 1)];
      const e2 = (t === 'journal' ? D.journal : D.dreams).find(x => x.id === eid);
      b.disabled = true; b.textContent = '翻译中…';
      try { const src = entryText({ ...e2, _t: t }) + (t === 'dream' && readingText(e2) ? '\n\n— Reading —\n' + readingText(e2) : '');
        tr[k] = (await ai({ mode: 'translate', text: src, to: 'zh' })).text; render(); }
      catch { b.disabled = false; b.textContent = '🌐 翻译失败，再试一次'; }
      break; }

    case 'kind': AI.kind = k; AI.items = []; render(); break;
    case 'ai-suggest': {
      AI.busy = true; const hint = $('#idea').value.trim(); render(); $('#idea').value = hint;
      try { AI.items = (await ai({ mode: 'suggest', kind: AI.kind, hint })).items; }
      catch (err) { AI.items = []; toast(String(err.message) === 'rate_limited' ? '今天用 AI 的次数够多了，明天再试吧。' : 'AI 暂时没有回应，稍后再试。'); }
      AI.busy = false; render(); $('#idea').value = hint; break; }
    case 'ai-drop': AI.items.splice(+b.dataset.i, 1); render(); break;
    case 'ai-send': {
      const it = AI.items[+b.dataset.i]; b.disabled = true;
      const row = { owner, author: me.id, kind: it.kind, title: it.title_en, body: it.body_en, title_zh: it.title_zh, body_zh: it.body_zh,
        steps: it.steps.map(s => ({ emoji: s.emoji, title: s.title_en, title_zh: s.title_zh, minutes: s.minutes })), ai_assisted: true };
      const { data, error } = await sb.from('jo_suggestions').insert(row).select().single();
      if (error) { b.disabled = false; return toast('发送失败：' + error.message); }
      D.sugg.unshift(data); AI.items.splice(+b.dataset.i, 1); toast('发给他了 ✓'); render(); break; }
    case 'send-direct': {
      const t = $('#idea').value.trim(); if (!t) { $('#ideamsg').textContent = '请先写下你的想法。'; return; }
      b.disabled = true; $('#ideamsg').textContent = '正在发送…';
      let en = t; try { en = (await ai({ mode: 'translate', text: t, to: 'en' })).text; } catch {}
      const firstLine = s => s.split(/\n|[。.!！?？]/)[0].slice(0, 80);
      const row = { owner, author: me.id, kind: AI.kind, title: firstLine(en), body: en, title_zh: firstLine(t), body_zh: t, steps: [], ai_assisted: false };
      const { data, error } = await sb.from('jo_suggestions').insert(row).select().single();
      if (error) { b.disabled = false; $('#ideamsg').textContent = '发送失败：' + error.message; return; }
      D.sugg.unshift(data); toast('发给他了 ✓'); render(); break; }
    case 'sugg-del': {
      if (!confirm('撤回这个建议？')) return;
      const { error } = await sb.from('jo_suggestions').delete().eq('id', id);
      if (error) return toast('撤回失败：' + error.message);
      D.sugg = D.sugg.filter(s => s.id !== id); render(); break; }

    case 'rec': startRec(k); break;
    case 'stop': if (R) R.rec.stop(); break;
    case 'redo': { const key = R.key; R = null; startRec(key); break; }
    case 'cancel': cancelRec(); break;
    case 'save': {
      const { key, blob, mime, secs } = R; b.disabled = true;
      if (await upload(key, blob, mime, secs)) { R = null; render(); msg(key, '保存好了 ✓'); } else b.disabled = false;
      break; }
    case 'play': {
      const au = audioFor(k); const { data, error } = await sb.storage.from('jo-media').createSignedUrl(au.path, 3600);
      if (error) { msg(k, '无法播放：' + error.message); return; }
      $('#play-' + k).innerHTML = `<audio controls autoplay src="${data.signedUrl}"></audio>`; break; }
    case 'del': {
      if (!confirm('删除这一章的录音？')) return;
      const au = audioFor(k);
      const res = await sb.from('jo_journey_audio').delete().eq('id', au.id);
      if (res.error) { msg(k, '删除失败：' + res.error.message); return; }
      await sb.storage.from('jo-media').remove([au.path]); D.audio = D.audio.filter(x => x.id !== au.id); render(); break; }
  }
});
document.addEventListener('change', async e => {
  const inp = e.target; if (inp.type !== 'file' || !inp.files[0]) return;
  const f = inp.files[0], key = inp.dataset.k;
  if (await upload(key, f, f.type || 'audio/mpeg', null)) { render(); msg(key, '保存好了 ✓'); }
});
document.addEventListener('visibilitychange', async () => {
  if (document.hidden || !owner || R || tab === 'ideas') return;
  await loadAll(); render();
});

(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) enter(data.session.user); else signIn();
  sb.auth.onAuthStateChange((ev, s) => { if (ev === 'SIGNED_IN' && s && !me) enter(s.user); });
})();
</script>
